[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked  = "deny"
ignore  = [
    # Both crates are flagged "unmaintained" but have no security CVE and no safe
    # upgrade available. Pulled in transitively via alloy-sol-types. Revisit if
    # alloy migrates off them or if a real vulnerability is filed.
    "RUSTSEC-2024-0388",  # derivative — unmaintained
    "RUSTSEC-2024-0436",  # paste      — unmaintained
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny = [
    # Disallow accidental std-using deps in primitives crate.
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
