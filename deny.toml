[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked  = "deny"
ignore  = [
    # Both crates are flagged "unmaintained" but have no security CVE and no safe
    # upgrade available. Pulled in transitively via alloy-sol-types. Revisit if
    # alloy migrates off them or if a real vulnerability is filed.
    "RUSTSEC-2024-0388",  # derivative        — unmaintained
    "RUSTSEC-2024-0436",  # paste             — unmaintained
    "RUSTSEC-2026-0173",  # proc-macro-error2 — unmaintained (build-time only,
                          # pulled via alloy-sol-macro / alloy-sol-types). No CVE;
                          # not in the runtime artifact. Revisit if alloy migrates.
    # bincode 1.3.3 — pulled in transitively by Solana Anza split crates for
    # VersionedTransaction wire serialization. The advisory is unmaintained-status
    # only (maintainer team disbanded after a harassment incident); no CVE, no
    # known security defect. Revisit when Solana migrates to wincode/postcard.
    "RUSTSEC-2025-0141",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MITNFA",  # MIT + "No False Attributions" clause; transitive via hex_lit (a bitcoin 0.32 dep).
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny = [
    # Disallow accidental std-using deps in primitives crate.
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
