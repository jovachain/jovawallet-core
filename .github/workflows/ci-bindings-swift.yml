name: ci-bindings-swift
on: [push, pull_request]

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-swift-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-swift-cargo-

      # uniffi CLI binary ships inside the uniffi umbrella crate (0.30+).
      # Install via --features cli so both uniffi-bindgen and uniffi-bindgen-swift
      # are placed on PATH. The CLI MUST be the exact same version as the `uniffi`
      # macro crate, or metadata extraction fails with "No UniFFI metadata found".
      # Pin to the version resolved in Cargo.lock (do NOT install latest).
      - name: Install uniffi-bindgen
        run: |
          UNIFFI_VERSION="$(grep -A1 '^name = "uniffi"$' Cargo.lock | grep '^version = ' | cut -d'"' -f2)"
          echo "Pinning uniffi CLI to ${UNIFFI_VERSION} (matches Cargo.lock)"
          cargo install uniffi --features cli --locked --version "=${UNIFFI_VERSION}"

      # Build XCFramework (device + sim + macOS universal) then run Swift tests.
      - run: ./bindings/swift/scripts/build-xcframework.sh
      - run: cd bindings/swift && swift test
