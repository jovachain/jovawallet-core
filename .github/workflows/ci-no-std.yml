name: ci-no-std
on: [push, pull_request]

jobs:
  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-nostd-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-nostd-cargo-

      # gcc-arm-none-eabi provides the linker and runtime stubs needed when
      # cross-compiling to the Cortex-M target (spike finding: build fails without it).
      - name: Install ARM bare-metal toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      # --no-default-features disables the "std" feature so the build actually
      # validates that jova-core-primitives compiles without the standard library.
      # (Task 3 finding: the crate's default feature is "std"; without this flag
      # the build silently enables std and the no_std guarantee is not tested.)
      - name: Build no_std baseline
        run: cargo build -p jova-core-primitives --target thumbv7em-none-eabihf --no-default-features

      # Phase 7: validate the firmware target config that hardware integrations use.
      # `external-rng` activates Mnemonic::generate_with(&mut impl JovaRng) for
      # consumers that drive their own hardware TRNG instead of getrandom.
      - name: Build no_std + external-rng (firmware config)
        run: cargo build -p jova-core-primitives --target thumbv7em-none-eabihf --no-default-features --features external-rng

      # Native test of the external-rng path so test failures land in CI even
      # though the embedded-target tests aren't run on bare metal.
      - name: Test external-rng feature paths
        run: cargo test -p jova-core-primitives --features external-rng --test external_rng

      - name: Test JovaWallet::from_seed_bytes
        run: cargo test -p jova-core --features external-rng --test from_seed_bytes

      # Phase 7: build the firmware-template example for the embedded target.
      # Smoke-tests that the example's dependency chain stays no_std-clean.
      - name: Build firmware-template example
        run: cargo build --manifest-path examples/firmware-template/Cargo.toml --target thumbv7em-none-eabihf --release
