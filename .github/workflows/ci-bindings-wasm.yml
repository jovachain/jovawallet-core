name: ci-bindings-wasm
on: [push, pull_request]

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-wasm-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      # pnpm 10+ required; install before setup-node so corepack can pick it up.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 22+: pnpm 10 requires Node >= 18; 22 LTS is the current recommended.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bindings/wasm/pnpm-lock.yaml

      # Build WASM with --target nodejs (spike finding: file:// fetch is not
      # supported by Node's undici; nodejs target uses fs.readFileSync instead).
      # wasm-opt = false is already set in crates/jova-core-wasm/Cargo.toml, so no
      # override is needed here.  Phase 6 enabled jova-core's `chains` feature
      # in the WASM crate, so this build also exercises the full secp256k1 +
      # alloy + Solana dep tree against wasm32-unknown-unknown.
      - run: ./bindings/wasm/scripts/build-wasm.sh

      # Phase 6: pnpm test runs hello.test.ts (smoke), evm-vectors.test.ts,
      # sol-vectors.test.ts (full byte-equal parity with the Rust core's
      # vector tests for both chain families), plus unsupported-chains.test.ts
      # (asserts BTC + XRP are rejected at the WASM boundary per the
      # 2026-05-11 user decision).  See bindings/wasm/COVERAGE.md.
      - run: cd bindings/wasm && pnpm install && pnpm test
