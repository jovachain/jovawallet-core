[package]
name = "jova-core"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Public Rust API for jovawallet-core"

[lib]

[features]
# `chains` pulls in jova-core-chains (alloy, secp256k1-sys, etc.) and exposes
# JovaWallet, JovaChain, JovaError and the full signing surface.  It is the
# default for native builds.  WASM builds (jova-core-wasm) opt out so they
# avoid the C secp256k1-sys build step; the functional WASM signing surface
# lands in Phase 6 once we have a wasm-compatible secp256k1 path.
default = ["chains"]
chains = ["dep:jova-core-chains", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:hex", "dep:secp256k1"]
# Phase 7: forwards the primitives crate's `external-rng` feature so firmware
# consumers can call `Mnemonic::generate_with` and `JovaWallet::from_seed_bytes`.
external-rng = ["jova-core-primitives/external-rng"]

[dependencies]
jova-core-primitives.workspace = true
jova-core-chains = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
secp256k1 = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true
proptest.workspace = true
# Independent verifiers for the multi-account key/address parity test
# (tests/multi_account.rs). All are already in the build graph via
# jova-core-chains + Cargo.lock, so they add no meaningful compile cost.
alloy = { workspace = true }                       # EVM ecrecover (k256 via signer-local)
ed25519-dalek = { workspace = true }              # Solana sig verify
sha2 = { workspace = true }                        # XRP account-id + checksum
ripemd = { workspace = true }                      # XRP account-id
bs58 = "0.5.1"                                     # base58 (Solana pubkey, XRP address)
base64 = "0.22.1"                                  # Solana message payload encoding
