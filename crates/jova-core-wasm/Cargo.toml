[package]
name = "jova-core-wasm"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen layer for jova-core"

[lib]
crate-type = ["cdylib"]

# wasm-pack 0.14 bundles a wasm-opt that rejects bulk-memory ops emitted by
# rustc 1.95+. Disable the post-pass; production Phase 6 builds should install a
# current binaryen and re-enable. (Spike finding: spike/feasibility Cargo.toml.)
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Feature flags here are documentation of intent: which chains the WASM package
# considers functional. They do NOT gate compilation — the chains crate is in
# unconditionally because gating it would mean a much larger refactor across
# jova-core-chains.  Runtime rejection of Bitcoin / XRP variants happens in
# src/lib.rs before any chain code executes.  See bindings/wasm/COVERAGE.md.
[features]
default = ["chain-evm", "chain-sol"]
chain-evm = []
chain-sol = []
# chain-btc, chain-xrp deliberately omitted from default per the 2026-05-11
# recorded decision.  The flags remain declared so downstream tooling can read
# the intent from Cargo metadata.
chain-btc = []
chain-xrp = []

[dependencies]
# jova-core with no `chains` feature: avoids secp256k1-sys (a C crate) which
# cannot compile for wasm32-unknown-unknown on macOS with Apple clang.
# Phase 6 will re-enable chain signing once a wasm-compatible signing path exists.
jova-core.workspace = true
wasm-bindgen.workspace = true
serde-wasm-bindgen.workspace = true
# getrandom 0.3 uses `wasm_js` feature for browser RNG (renamed from `js` in 0.2).
getrandom = { workspace = true, features = ["wasm_js"] }
