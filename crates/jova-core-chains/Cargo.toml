[package]
name = "jova-core-chains"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-chain encoding and signing for jovawallet-core"

[lib]

[dependencies]
jova-core-primitives.workspace = true
alloy.workspace = true
secp256k1.workspace = true
sha3.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
base64.workspace = true
thiserror.workspace = true
# Bitcoin support (Phase 2): rust-bitcoin for BIP-84 address encoding.
# bdk_wallet is added in the PSBT-signing task.
bitcoin = { workspace = true, features = ["std"] }
# XRP support (Phase 3b): xrpl-rust 1.1. Crate name on crates.io is `xrpl-rust`;
# the Rust module is `xrpl`. We use only the address codec + binary codec —
# never the network client. Inherit workspace features so binarycodec functions
# are visible.
xrpl-rust = { workspace = true }
# XRPL address hashing: SHA256 (already pulled via sha2 from primitives) +
# RIPEMD-160. SHA512 needed for canonical signing prefix half-hash.
sha2.workspace = true
ripemd.workspace = true
# Solana support (Phase 3c): Anza split crates. Only `solana-pubkey` is
# strictly required for address derivation; the rest are added as the tx
# signing and message signing tasks land.
solana-pubkey = { workspace = true }
solana-keypair = { workspace = true }
solana-signature = { workspace = true }
solana-message = { workspace = true }
solana-transaction = { workspace = true }
ed25519-dalek.workspace = true
# bs58 (base58 alphabet) for Solana signature/hash encoding. Solana uses the
# Bitcoin base58 alphabet — same as `bs58 0.5` (workspace dep was Phase 2's
# default).
bs58 = "0.5"
# bincode for serializing VersionedTransaction; Solana split crates pin to
# 1.3.x (pre-2.x migration), so we match that here.
bincode = "1.3"
