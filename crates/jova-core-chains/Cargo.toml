[package]
name = "jova-core-chains"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-chain encoding and signing for jovawallet-core"

[lib]

[dependencies]
jova-core-primitives.workspace = true
alloy.workspace = true
secp256k1.workspace = true
sha3.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
base64.workspace = true
thiserror.workspace = true
# Bitcoin support (Phase 2): rust-bitcoin for BIP-84 address encoding.
# bdk_wallet is added in the PSBT-signing task.
bitcoin = { workspace = true, features = ["std"] }
# XRP support (Phase 3b): xrpl-rust 1.1. Crate name on crates.io is `xrpl-rust`;
# the Rust module is `xrpl`. We use only the address codec + binary codec —
# never the network client. Inherit workspace features so binarycodec functions
# are visible.
xrpl-rust = { workspace = true }
# XRPL address hashing: SHA256 (already pulled via sha2 from primitives) +
# RIPEMD-160. SHA512 needed for canonical signing prefix half-hash.
sha2.workspace = true
ripemd.workspace = true
# Solana support (Phase 3c): Anza split crates. `serde` features are needed
# for bincode (de)serialization of VersionedMessage/VersionedTransaction —
# the derives are gated behind `#[cfg(feature = "serde")]` upstream.
solana-pubkey = { workspace = true, features = ["serde"] }
solana-keypair = { workspace = true }
solana-signature = { workspace = true, features = ["serde", "std"] }
solana-message = { workspace = true, features = ["serde"] }
solana-transaction = { workspace = true, features = ["serde"] }
ed25519-dalek.workspace = true
# Solana uses the Bitcoin base58 alphabet. bs58 0.5 is the de-facto Solana
# encoder; we use it directly for signature-base58 output. (workspace base58
# is for legacy Phase 2 use; bs58 is a different crate.)
bs58 = "0.5"
# bincode for serializing VersionedTransaction; Solana split crates pin to
# 1.3.x (pre-2.x migration), so we match that here.
bincode = "1.3"
