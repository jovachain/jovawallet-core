[package]
name = "jova-core-primitives"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "no_std-clean cryptographic primitives for jovawallet-core"

[lib]

[features]
default = ["std"]
std = ["dep:thiserror", "dep:getrandom"]

[dependencies]
zeroize.workspace = true
bip39.workspace = true
bip32.workspace = true
secp256k1.workspace = true
# Phase 3c — SLIP-10 ed25519 hierarchical key derivation for Solana. The
# `slip-10` crate on crates.io does not implement ed25519 (its README:
# "Implementation currently does not support ed25519 curve"), so the
# algorithm is in-crate. ed25519-dalek is used solely to expand a derived
# secret scalar to the corresponding 32-byte public key.
ed25519-dalek.workspace = true
hmac.workspace = true
sha2.workspace = true
sha3.workspace = true
hex.workspace = true
thiserror = { workspace = true, optional = true }
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
hex.workspace = true
